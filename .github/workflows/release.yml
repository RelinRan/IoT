name: Build and Release AAR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build IoT AAR
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK Platform 35
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses and install build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building IoT Android library version ${VERSION}"

      - name: Build release AAR with detailed logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts logs
          gradle clean assembleRelease --stacktrace --info 2>&1 | tee logs/gradle-build.log
          cp build/outputs/aar/IoT-release.aar "artifacts/iot-${{ steps.version.outputs.version }}.aar"
          sha256sum artifacts/*.aar | tee logs/sha256.txt
          ls -lh artifacts logs

      - name: Upload AAR and build logs
        uses: actions/upload-artifact@v4
        with:
          name: iot-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.aar
            logs/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: IoT v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.aar
            logs/sha256.txt
